<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Challenge</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="game">

        <p id="phrase" class="phrase">Press PLAY to start.</p>

        <input
            id="typing-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            disabled
        >

        <div class="scores">
            <p>WPM: <span id="score">0</span></p>
            <p>Best: <span id="best">0</span></p>
        </div>

        <button id="play-btn" type="button" hidden>PLAY AGAIN</button>
    </main>
</body>
</html>
